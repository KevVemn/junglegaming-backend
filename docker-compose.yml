services:
  postgres:
    image: postgres:16-alpine
    container_name: jg-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-junglegaming}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-junglegaming}
      POSTGRES_DB: ${DB_NAME:-junglegaming}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-junglegaming} -d ${DB_NAME:-junglegaming}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [jg]

  keycloak-db:
    image: postgres:16-alpine
    container_name: jg-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [jg]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: jg-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [jg]

  localstack:
    image: localstack/localstack:3.8
    container_name: jg-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [jg]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: jg-migrate
    command: ["/app/bin/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-junglegaming}
      DB_PASSWORD: ${DB_PASSWORD:-junglegaming}
      DB_NAME: ${DB_NAME:-junglegaming}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [jg]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-junglegaming}
      DB_PASSWORD: ${DB_PASSWORD:-junglegaming}
      DB_NAME: ${DB_NAME:-junglegaming}
      DB_SSLMODE: disable
      AUTH_ENABLED: "true"
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/junglegaming
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/junglegaming
      OIDC_AUDIENCE: wagering-api
      OIDC_PROVIDER_CLAIM: provider_id
      OIDC_INTERNAL_CLAIM: scope_internal
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      LOG_LEVEL: info
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [jg]

volumes:
  postgres_data:
  keycloak_data:

networks:
  jg:
    driver: bridge
